
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Card</title>
    <link rel="stylesheet" href="QR-Code.css">
</head>

<body>

    <main class="card">

        <img
            src="images/image-qr-code.png"
            alt="QR Code"
            class="qr-code"
             width=200px
        >

        <h1>
            Improve your front-end skills by building projects
        </h1>

        <p>
            Scan your QR code to visit Frontend Mentor
            and take your coding skills to the next level
        </p>

    </main>

</body>
</html>
